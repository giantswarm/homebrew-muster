name: Update formula

on:
  schedule:
    # Check for new muster releases hourly.
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula from latest muster release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/update-formula.sh

      - name: Commit and push
        run: |
          if git diff --quiet Formula/muster.rb; then
            exit 0
          fi
          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Formula/muster.rb)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/muster.rb
          git commit -m "Update muster to v$version"
          git push
