name: Update formula

# Brings Formula/muster.rb to a giantswarm/muster release.
#
# The release pipeline of giantswarm/muster (.circleci/custom.yml there) sends
# a `muster-release` repository dispatch once a release's binaries are
# uploaded. "Check for a new release" runs this workflow on a schedule as a
# fallback, and `gh workflow run update-formula.yaml [-f tag=v5.22.0]` runs it
# by hand. A run verifies the binaries against their Sigstore bundles,
# installs the formula on the runner, then opens a pull request as heraldbot,
# Giant Swarm's automation App, and closes the update pull requests it
# supersedes. The default branch requires a review, so the run does not merge:
# the team's scheduled marge sweep (https://github.com/giantswarm/marge)
# approves and squash-merges heraldbot pull requests once their checks are
# green. (A pull request opened with the GitHub Actions token would not run
# this repository's checks.)

on:
  repository_dispatch:
    types: [muster-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to pin the formula to, e.g. v5.22.0. Empty: the newest release with published binaries."
        required: false
        default: ""

permissions:
  contents: read
  actions: write # re-enable the scheduled fallback

# Releases minutes apart queue up instead of racing for the same branch.
concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a heraldbot token
        id: heraldbot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HERALD_CLIENT_ID }}
          private-key: ${{ secrets.HERALD_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.heraldbot.outputs.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Update the formula
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_TAG: ${{ github.event.client_payload.tag }}
          PINNED_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$PINNED_TAG" ]; then
            scripts/update-formula.sh --pin "$PINNED_TAG"
          else
            scripts/update-formula.sh "$DISPATCHED_TAG"
          fi

      - name: Install and test the formula
        if: steps.update.outputs.changed == 'true'
        run: scripts/test-formula.sh

      - name: Open the pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.heraldbot.outputs.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail
          branch="update/v$VERSION"
          git config user.name "heraldbot[bot]"
          git config user.email "149080493+heraldbot[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git commit --all --message "Update muster to v$VERSION"
          # A rerun for the same version replaces the branch and reuses its pull request.
          git push --force --set-upstream origin "$branch"
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            number=$(gh pr create --base main --head "$branch" \
              --title "Update muster to v$VERSION" \
              --body "Automated update to [v$VERSION](https://github.com/giantswarm/muster/releases/tag/v$VERSION).

          Every binary was verified against its Sigstore bundle, and the formula was installed and tested on the runner of [this run]($run)." \
              | sed 's#.*/pull/##')
          fi
          echo "opened $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$number; the marge sweep merges it once it is green"
          # The formula on main is older than this version, so every other open
          # update pull request is an older one this pull request replaces.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"update/v\")) | select(.number != $number) | .number" |
            while read -r older; do
              gh pr close "$older" --delete-branch --comment "Superseded by #$number."
            done

      - name: Keep the scheduled fallback armed
        # GitHub disables a scheduled workflow after 60 days without a commit.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable check-release.yaml
